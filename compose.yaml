services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: market
      POSTGRES_USER: market
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market -d market"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://market:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}@db:5432/market
      UPLOAD_DIR: /app/uploads
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
      - ${FIREBASE_ADMIN_CREDENTIALS_PATH:?Set path to Firebase service account}:/run/secrets/firebase-admin.json:ro
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  uploads:
